# MongoDB Configuration for Testing
spring.data.mongodb.uri=mongodb://localhost:27017/ecfr_test

# Logging Configuration
logging.level.com.ecfr=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-empty-string-as-null-object=true
spring.jackson.serialization.write-empty-json-arrays=false
spring.jackson.serialization.write-single-elem-arrays-unwrapped=true

# eCFR API Configuration
ecfr.api.base-url=https://ecfr.gov/api/v1
ecfr.api.timeout=30000
ecfr.api.retry.max-attempts=3
ecfr.api.retry.initial-interval=1000
ecfr.api.retry.multiplier=2.0
ecfr.api.retry.max-interval=10000

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Embedded MongoDB version
de.flapdoodle.mongodb.embedded.version=6.0.5