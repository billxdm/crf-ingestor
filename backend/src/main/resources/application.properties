# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.connection-pool-size=100
spring.data.mongodb.connection-timeout=5000
spring.data.mongodb.socket-timeout=3000
spring.data.mongodb.max-wait-time=1500
spring.data.mongodb.write-concern=MAJORITY
spring.data.mongodb.read-preference=SECONDARY_PREFERRED
spring.data.mongodb.retry-writes=true
spring.data.mongodb.retry-reads=true
spring.data.mongodb.uri=mongodb://localhost:27017/ecfr

# MongoDB GridFS Configuration for Large Files
spring.data.mongodb.gridfs.database=ecfr
spring.data.mongodb.gridfs.bucket=xml_content

# Logging Configuration
logging.level.com.ecfr=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Async Configuration
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=200

# eCFR API Configuration
ecfr.api.base-url=https://www.ecfr.gov/api/versioner/v1
ecfr.api.connection-timeout=30000
ecfr.api.read-timeout=30000
ecfr.api.retry-attempts=3
ecfr.api.retry-delay=1000
ecfr.api.batch-size=10

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-empty-string-as-null-object=true
spring.jackson.serialization.write-empty-json-arrays=false
spring.jackson.serialization.write-single-elem-arrays-unwrapped=true

# File upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true 