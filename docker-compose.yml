version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ecfr_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/src/main/resources/mongodb/mongod.conf:/etc/mongod.conf
      - ./backend/src/main/resources/db/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    command: mongod --config /etc/mongod.conf
    environment:
      - MONGO_INITDB_DATABASE=ecfr_db
    networks:
      - ecfr_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecfr_backend
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=ecfr_db
    networks:
      - ecfr_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecfr_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ecfr_network

networks:
  ecfr_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
